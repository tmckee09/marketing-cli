name: Import upstream snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone upstream
        run: git clone --depth 1 https://github.com/MoizIbnYousaf/marketing-cli.git /tmp/upstream
      - name: Replace destination working tree with upstream snapshot
        run: rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/upstream/ ./
      - name: Commit imported snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A
          if git diff --cached --quiet; then
            echo "No changes to import."
          else
            git commit -m "Import complete MoizIbnYousaf/marketing-cli snapshot"
            git push origin HEAD:main
          fi
